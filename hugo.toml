baseURL = 'https://vennerstrom.se/'
locale = 'sv-SE'
title = 'Victor Vennerström'

disableKinds = ['taxonomy', 'term', 'rss']
enableRobotsTXT = true

[params]
  author = 'Victor Vennerström'
  description = 'Victor Vennerström är art director i Göteborg — koncept, kampanj och form för varumärken som vill säga något.'
  # Share image (og:image) for pages without a banner. A path in assets/.
  shareImage = 'images/victor.webp'
  # Items rendered into the page; the rest come from posts.json via "Visa fler"
  workInitial = 4
  workBatch = 4
  blogInitial = 5
  blogBatch = 5
  backgroundInitial = 3
  backgroundBatch = 3
  # Media items warmed while a case link is hovered (main.js): the case's first screen
  preloadMedia = 3
  # How far parallax images are zoomed (80-flare.css derives the drift from it), so their
  # srcset sizes can allow for it
  parallaxZoom = 1.22
  # What the reveals bring in, for both 70-motion.css and main.js: .reveal, and every direct
  # child of a [data-reveal-children] container (Markdown output has no classes). A nested
  # container reveals its own children instead of itself.
  reveal = '.reveal, [data-reveal-children] > :not([data-reveal-children])'

[permalinks.page]
  work = '/:contentbasename/'
  blog = '/:contentbasename/'

# Structured data (JSON-LD) on the home page. Links and e-mail come from the contact list in
# content/_index.md, the portrait from contact.portrait.
[params.person]
  jobTitle = 'Art Director'
  worksFor = 'Confetti'
  knowsAbout = ['Art direction', 'Koncept', 'Kampanj', 'Grafisk design', 'Illustration', 'Motion design', '3D', 'Webbutveckling', 'Varumärkesstrategi']
  awards = ['2x guld, Gerillaägget 2025', 'Shortlist, Svenska Designpriset 2025']

# posts.json: every case and post, in listing order, for "Visa fler" (main.js)
[outputFormats.posts]
  mediaType = 'application/json'
  baseName = 'posts'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['html', 'posts']

[markup.goldmark.parser]
  # A lone image becomes its own block, so the image hook can return a <figure>
  # instead of a <figure> inside a <p>, which isn't valid HTML
  wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true
[markup.goldmark.renderer]
  # Lets a vimeo shortcode sit inside {{< grid >}} (the grid renders its inside as Markdown).
  # All content is written by the site owner.
  unsafe = true

# hugo --minify drops HTML comments, and with them the hello in assets/ascii.txt (baseof.html).
# Template comments never reach the HTML, so this keeps only that one.
[minify.tdewolff.html]
  keepComments = true

[imaging]
  resampleFilter = 'Lanczos'
  [imaging.webp]
    quality = 82

# Section nav (nav rail on desktop, menu overlay on phones). Anchors on the home page.
[menus]
  [[menus.main]]
    name = 'Intro'
    url = '/#intro'
    weight = 1
  [[menus.main]]
    name = 'Case'
    url = '/#case'
    weight = 2
  [[menus.main]]
    name = 'Om mig'
    url = '/#om-mig'
    weight = 3
  [[menus.main]]
    name = 'Bakgrund'
    url = '/#bakgrund'
    weight = 4
  [[menus.main]]
    name = 'Lösa skott'
    url = '/#losa-skott'
    weight = 5
  [[menus.main]]
    name = 'Kontakt'
    url = '/#kontakt'
    weight = 6
